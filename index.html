<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1.0,user-scalable=no">
<title>Real Car Parking</title>

<style>
*{
  box-sizing:border-box;
  user-select:none;
  -webkit-user-select:none;
}

body{
  margin:0;
  background:#111;
  color:white;
  font-family:Arial,sans-serif;
  text-align:center;
  overflow:hidden;
}

h1{
  margin:8px 0 2px;
  font-size:27px;
}

#info{
  font-size:17px;
  margin-bottom:7px;
}

#game{
  position:relative;
  width:min(94vw,420px);
  height:min(70vh,650px);
  min-height:500px;
  margin:auto;
  overflow:hidden;
  border:6px solid white;
  border-radius:20px;
  background:#333;
  box-shadow:0 0 25px #000;
}

#road{
  position:absolute;
  inset:0;
  background:
    linear-gradient(90deg,
      #222 0 8%,
      #555 8% 10%,
      #333 10% 90%,
      #555 90% 92%,
      #222 92% 100%);
}

.line{
  position:absolute;
  width:6px;
  height:80px;
  background:white;
  left:50%;
  transform:translateX(-50%);
}

#parking{
  position:absolute;
  width:105px;
  height:175px;
  right:28px;
  top:80px;
  border:4px dashed #00ff77;
  border-radius:10px;
  color:#00ff77;
  font-weight:bold;
  padding-top:8px;
}

.car{
  position:absolute;
  width:62px;
  height:110px;
  border-radius:18px;
  transform-origin:center;
}

#player{
  left:50%;
  bottom:30px;
  transform:translateX(-50%);
  background:linear-gradient(90deg,#8b0000,#ff2020,#8b0000);
  box-shadow:0 8px 15px #000;
  z-index:10;
}

.car:before{
  content:"";
  position:absolute;
  left:8px;
  right:8px;
  top:12px;
  height:40px;
  border-radius:12px;
  background:linear-gradient(#bfe8ff,#46758d);
  border:3px solid #111;
}

.car:after{
  content:"";
  position:absolute;
  left:13px;
  right:13px;
  bottom:13px;
  height:13px;
  background:#111;
  border-radius:8px;
}

.enemy{
  background:linear-gradient(90deg,#777,#eee,#777);
  box-shadow:0 8px 15px #000;
}

.enemy:before{
  background:#18303c;
}

.wall{
  position:absolute;
  background:#777;
  border:3px solid #aaa;
  box-shadow:0 3px 8px #000;
}

#gearBox{
  position:absolute;
  top:12px;
  left:12px;
  background:#111d;
  border:3px solid white;
  border-radius:12px;
  padding:8px 12px;
  font-size:20px;
  font-weight:bold;
  z-index:30;
}

#lives{
  position:absolute;
  top:12px;
  right:12px;
  background:#111d;
  border-radius:12px;
  padding:7px 10px;
  font-size:22px;
  z-index:30;
}

#message{
  position:absolute;
  inset:0;
  display:none;
  align-items:center;
  justify-content:center;
  flex-direction:column;
  background:#000b;
  z-index:100;
  font-size:28px;
  font-weight:bold;
}

button{
  border:0;
  border-radius:16px;
  background:#1597ed;
  color:white;
  font-size:20px;
  font-weight:bold;
  padding:14px 20px;
  touch-action:none;
}

.controls{
  width:min(96vw,500px);
  margin:9px auto;
  display:flex;
  justify-content:center;
  gap:9px;
  flex-wrap:wrap;
}

.controls button{
  min-width:105px;
}

#steer{
  width:100px;
  height:100px;
  border-radius:50%;
  background:#222;
  border:9px solid #ddd;
  font-size:42px;
  padding:0;
}

#gears{
  display:flex;
  gap:5px;
  justify-content:center;
  margin-top:4px;
}

#gears button{
  min-width:54px;
  padding:10px 5px;
  font-size:16px;
}

.small{
  font-size:13px;
  opacity:.7;
}
</style>
</head>

<body>

<h1>🚗 Real Car Parking</h1>
<div id="info">
  Level: <b id="level">1</b> |
  Speed: <b id="speed">0</b> km/h |
  Score: <b id="score">0</b>
</div>

<div id="game">

  <div id="road"></div>

  <div class="line" style="top:0"></div>
  <div class="line" style="top:180px"></div>
  <div class="line" style="top:360px"></div>
  <div class="line" style="top:540px"></div>

  <div id="parking">PARK HERE</div>

  <div class="wall"
       style="width:55px;height:100px;left:20px;top:180px"></div>

  <div class="wall"
       style="width:55px;height:100px;right:20px;top:350px"></div>

  <div class="car enemy" id="enemy1"
       style="left:30px;top:40px"></div>

  <div class="car enemy" id="enemy2"
       style="right:35px;top:270px"></div>

  <div id="player" class="car"></div>

  <div id="gearBox">GEAR: N</div>
  <div id="lives">❤️❤️❤️</div>

  <div id="message">
    <div id="msgText">LEVEL COMPLETE!</div>
    <button onclick="restart()">Restart</button>
  </div>

</div>

<div class="controls">

  <button id="left">⬅️ LEFT</button>

  <button id="steer">↕️</button>

  <button id="right">RIGHT ➡️</button>

</div>

<div id="gears">
  <button onclick="setGear(-1)">R</button>
  <button onclick="setGear(0)">N</button>
  <button onclick="setGear(1)">1</button>
  <button onclick="setGear(2)">2</button>
  <button onclick="setGear(3)">3</button>
  <button onclick="setGear(4)">4</button>
  <button onclick="setGear(5)">5</button>
</div>

<div class="small">
  Steering wheel / Left / Right • Phone tilt भी काम करेगा
</div>

<script>

const game = document.getElementById("game");
const player = document.getElementById("player");

let x = game.clientWidth / 2 - 31;
let y = game.clientHeight - 145;

let angle = 0;
let gear = 0;
let speed = 0;
let score = 0;
let level = 1;
let lives = 3;

let leftPressed = false;
let rightPressed = false;

const gearNames = ["R","N","1","2","3","4","5"];
const gearSpeed = [3,0,2.5,4,5.5,7,9];

function setGear(g){
  gear = g;

  document.getElementById("gearBox").innerText =
    "GEAR: " + gearNames[g+1];

  if(g === -1){
    speed = -3;
  }else if(g === 0){
    speed = 0;
  }
}

function updatePlayer(){

  if(gear === 0){
    speed *= .92;
  }else if(gear > 0){
    speed += (gearSpeed[gear+1] - speed) * .05;
  }else{
    speed = -3;
  }

  let steer = 0;

  if(leftPressed) steer = -1;
  if(rightPressed) steer = 1;

  angle += steer * Math.min(Math.abs(speed)*0.65,5);

  let rad = angle * Math.PI / 180;

  x += Math.sin(rad) * speed;
  y -= Math.cos(rad) * speed;

  if(x < 5) x = 5;
  if(x > game.clientWidth-67) x = game.clientWidth-67;
  if(y < 5) y = 5;
  if(y > game.clientHeight-115) y = game.clientHeight-115;

  player.style.left = x+"px";
  player.style.top = y+"px";
  player.style.transform =
    `rotate(${angle}deg)`;

  document.getElementById("speed").innerText =
    Math.round(Math.abs(speed)*12);

  checkCollision();
  checkParking();

  requestAnimationFrame(updatePlayer);
}

function rect(el){
  return el.getBoundingClientRect();
}

function hit(a,b){

  let A=rect(a);
  let B=rect(b);

  return !(
    A.right < B.left ||
    A.left > B.right ||
    A.bottom < B.top ||
    A.top > B.bottom
  );
}

let lastHit=0;

function checkCollision(){

  const now=Date.now();

  if(now-lastHit<1200) return;

  const objects=[
    document.getElementById("enemy1"),
    document.getElementById("enemy2"),
    ...document.querySelectorAll(".wall")
  ];

  for(let obj of objects){

    if(hit(player,obj)){

      lastHit=now;
      lives--;

      document.getElementById("lives").innerText =
        "❤️".repeat(Math.max(lives,0)) +
        "🖤".repeat(3-Math.max(lives,0));

      x=game.clientWidth/2-31;
      y=game.clientHeight-145;
      angle=0;
      speed=0;
      gear=0;

      document.getElementById("gearBox").innerText="GEAR: N";

      if(lives<=0){
        gameOver();
      }

      break;
    }
  }
}

function checkParking(){

  const p=rect(player);
  const park=rect(document.getElementById("parking"));

  const inside =
    p.left > park.left &&
    p.right < park.right &&
    p.top > park.top &&
    p.bottom < park.bottom;

  if(inside && Math.abs(speed)<1){

    score += 100;
    level++;

    document.getElementById("score").innerText=score;
    document.getElementById("level").innerText=level;

    showMessage("🅿️ PERFECT PARKING!");

    setTimeout(()=>{
      hideMessage();
      newLevel();
    },1300);
  }
}

function newLevel(){

  x=game.clientWidth/2-31;
  y=game.clientHeight-145;
  angle=0;
  speed=0;
  gear=0;

  const park=document.getElementById("parking");

  park.style.top =
    (70 + Math.random()*
    Math.max(100,game.clientHeight-260))+"px";

  park.style.right =
    (20 + Math.random()*100)+"px";
}

function gameOver(){
  showMessage("💥 GAME OVER");
}

function showMessage(text){
  document.getElementById("msgText").innerText=text;
  document.getElementById("message").style.display="flex";
}

function hideMessage(){
  document.getElementById("message").style.display="none";
}

function restart(){

  hideMessage();

  lives=3;
  score=0;
  level=1;
  gear=0;
  speed=0;
  angle=0;

  document.getElementById("score").innerText=0;
  document.getElementById("level").innerText=1;
  document.getElementById("lives").innerText="❤️❤️❤️";
  document.getElementById("gearBox").innerText="GEAR: N";

  newLevel();
}

/* LEFT / RIGHT */

function holdButton(btn,variable){

  btn.addEventListener("pointerdown",e=>{
    e.preventDefault();
    window[variable]=true;
  });

  btn.addEventListener("pointerup",()=>{
    window[variable]=false;
  });

  btn.addEventListener("pointercancel",()=>{
    window[variable]=false;
  });

  btn.addEventListener("pointerleave",()=>{
    window[variable]=false;
  });
}

holdButton(document.getElementById("left"),"leftPressed");
holdButton(document.getElementById("right"),"rightPressed");

/* STEERING WHEEL */

const steering=document.getElementById("steer");

let steeringStart=0;

steering.addEventListener("pointerdown",e=>{
  steeringStart=e.clientX;
  steering.setPointerCapture(e.pointerId);
});

steering.addEventListener("pointermove",e=>{

  if(!steering.hasPointerCapture(e.pointerId)) return;

  let diff=e.clientX-steeringStart;

  if(diff<-10){
    leftPressed=true;
    rightPressed=false;
  }

  if(diff>10){
    rightPressed=true;
    leftPressed=false;
  }
});

steering.addEventListener("pointerup",()=>{
  leftPressed=false;
  rightPressed=false;
});

/* MOBILE TILT */

if(window.DeviceOrientationEvent){

  window.addEventListener("deviceorientation",e=>{

    if(e.gamma==null) return;

    if(e.gamma < -10){
      leftPressed=true;
      rightPressed=false;
    }else if(e.gamma > 10){
      rightPressed=true;
      leftPressed=false;
    }else{
      leftPressed=false;
      rightPressed=false;
    }

  });
}

/* KEYBOARD */

document.addEventListener("keydown",e=>{

  if(e.key==="ArrowLeft") leftPressed=true;
  if(e.key==="ArrowRight") rightPressed=true;

  if(e.key==="1") setGear(1);
  if(e.key==="2") setGear(2);
  if(e.key==="3") setGear(3);
  if(e.key==="4") setGear(4);
  if(e.key==="5") setGear(5);
  if(e.key==="r" || e.key==="R") setGear(-1);
});

document.addEventListener("keyup",e=>{

  if(e.key==="ArrowLeft") leftPressed=false;
  if(e.key==="ArrowRight") rightPressed=false;

});

/* START */

restart();
updatePlayer();

</script>

</body>
</html>
