<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Speed Rush 🚗</title>

<style>
*{
  box-sizing:border-box;
  user-select:none;
}

body{
  margin:0;
  background:#111;
  color:white;
  font-family:Arial,sans-serif;
  text-align:center;
}

h1{
  margin:15px 0 5px;
}

#score{
  font-size:20px;
  margin-bottom:10px;
}

#game{
  position:relative;
  width:360px;
  max-width:95vw;
  height:600px;
  margin:auto;
  background:#333;
  overflow:hidden;
  border:4px solid white;
  border-radius:15px;
}

/* Road lines */
.road-line{
  position:absolute;
  width:8px;
  height:80px;
  background:white;
  left:50%;
  transform:translateX(-50%);
  animation:road 0.8s linear infinite;
}

@keyframes road{
  from{top:-100px}
  to{top:600px}
}

/* Player car */
#player{
  position:absolute;
  width:58px;
  height:90px;
  bottom:25px;
  left:151px;
  background:#e60000;
  border-radius:14px;
  border:3px solid #222;
  box-shadow:0 0 8px #000;
}

/* Car windows */
#player::before{
  content:"";
  position:absolute;
  width:38px;
  height:25px;
  background:#55c8ff;
  left:7px;
  top:10px;
  border-radius:8px;
}

#player::after{
  content:"";
  position:absolute;
  width:38px;
  height:20px;
  background:#222;
  left:7px;
  bottom:10px;
  border-radius:6px;
}

/* Enemy car */
.enemy{
  position:absolute;
  width:58px;
  height:90px;
  top:-100px;
  background:#ffd900;
  border-radius:14px;
  border:3px solid #222;
  box-shadow:0 0 8px #000;
}

.enemy::before{
  content:"";
  position:absolute;
  width:38px;
  height:25px;
  background:#55c8ff;
  left:7px;
  top:10px;
  border-radius:8px;
}

.enemy::after{
  content:"";
  position:absolute;
  width:38px;
  height:20px;
  background:#222;
  left:7px;
  bottom:10px;
  border-radius:6px;
}

/* Controls */
.controls{
  margin:15px auto;
  display:flex;
  justify-content:center;
  gap:20px;
}

button{
  width:130px;
  padding:15px;
  font-size:22px;
  border:none;
  border-radius:12px;
  background:#2196f3;
  color:white;
  font-weight:bold;
}

button:active{
  transform:scale(.95);
}

#gameOver{
  position:absolute;
  inset:0;
  background:rgba(0,0,0,.8);
  display:none;
  align-items:center;
  justify-content:center;
  flex-direction:column;
  z-index:10;
}

#gameOver h2{
  font-size:35px;
  margin:10px;
}

#gameOver p{
  font-size:22px;
}

#restartBtn{
  background:#00a83b;
  width:180px;
}
</style>
</head>

<body>

<h1>🏎️ Speed Rush</h1>
<div id="score">Score: 0</div>

<div id="game">

  <div class="road-line"></div>

  <div id="player"></div>

  <div id="gameOver">
    <h2>💥 GAME OVER</h2>
    <p id="finalScore">Score: 0</p>
    <button id="restartBtn">🔄 Restart</button>
  </div>

</div>

<div class="controls">
  <button id="leftBtn">⬅️ Left</button>
  <button id="rightBtn">Right ➡️</button>
</div>

<script>

const game = document.getElementById("game");
const player = document.getElementById("player");
const scoreText = document.getElementById("score");
const gameOver = document.getElementById("gameOver");
const finalScore = document.getElementById("finalScore");
const restartBtn = document.getElementById("restartBtn");

let playerX = 151;
let score = 0;
let speed = 5;
let running = true;
let enemies = [];

/* Move player */
function moveLeft(){
  if(!running) return;

  playerX -= 25;

  if(playerX < 5)
    playerX = 5;

  player.style.left = playerX + "px";
}

function moveRight(){
  if(!running) return;

  playerX += 25;

  if(playerX > 297)
    playerX = 297;

  player.style.left = playerX + "px";
}

/* Keyboard */
document.addEventListener("keydown",function(e){

  if(e.key === "ArrowLeft")
    moveLeft();

  if(e.key === "ArrowRight")
    moveRight();

});

/* Buttons */
document.getElementById("leftBtn")
.addEventListener("click",moveLeft);

document.getElementById("rightBtn")
.addEventListener("click",moveRight);


/* Create enemy car */
function createEnemy(){

  if(!running) return;

  const enemy = document.createElement("div");
  enemy.className = "enemy";

  const lanes = [25,151,277];
  const lane = lanes[Math.floor(Math.random()*lanes.length)];

  enemy.style.left = lane + "px";
  enemy.style.top = "-100px";

  game.appendChild(enemy);
  enemies.push(enemy);

  let y = -100;

  const move = setInterval(function(){

    if(!running){
      clearInterval(move);
      return;
    }

    y += speed;
    enemy.style.top = y + "px";

    /* Collision */
    const playerRect = player.getBoundingClientRect();
    const enemyRect = enemy.getBoundingClientRect();

    if(
      playerRect.left < enemyRect.right &&
      playerRect.right > enemyRect.left &&
      playerRect.top < enemyRect.bottom &&
      playerRect.bottom > enemyRect.top
    ){
      clearInterval(move);
      endGame();
      return;
    }

    /* Enemy passed */
    if(y > 650){

      clearInterval(move);
      enemy.remove();

      score++;
      scoreText.textContent = "Score: " + score;

      /* Speed increases */
      if(score % 5 === 0){
        speed += 0.7;
      }
    }

  },20);
}


/* Game Over */
function endGame(){

  running = false;

  finalScore.textContent = "🏆 Score: " + score;
  gameOver.style.display = "flex";
}


/* Restart */
function restart(){

  document.querySelectorAll(".enemy").forEach(e => e.remove());

  playerX = 151;
  score = 0;
  speed = 5;
  running = true;

  player.style.left = playerX + "px";
  scoreText.textContent = "Score: 0";
  gameOver.style.display = "none";
}


/* Restart button */
restartBtn.addEventListener("click",restart);


/* New enemy every 1.2 sec */
setInterval(createEnemy,1200);

</script>

</body>
</html>
