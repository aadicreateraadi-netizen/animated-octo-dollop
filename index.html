<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width,initial-scale=1.0,user-scalable=no">

<title>Real Car Rush</title>

<style>
*{
  box-sizing:border-box;
  user-select:none;
  -webkit-user-select:none;
}

body{
  margin:0;
  background:#080808;
  color:white;
  font-family:Arial,sans-serif;
  text-align:center;
  overflow:hidden;
}

h1{
  margin:8px 0 2px;
  font-size:30px;
}

#info{
  font-size:18px;
  margin-bottom:6px;
}

#game{
  position:relative;
  width:min(94vw,420px);
  height:min(72vh,700px);
  min-height:500px;
  margin:auto;
  overflow:hidden;
  border:6px solid white;
  border-radius:22px;
  background:#303030;
  perspective:600px;
}

/* ROAD */
#road{
  position:absolute;
  inset:0;
  background:
    linear-gradient(90deg,
      #333 0%,
      #333 12%,
      #252525 12%,
      #252525 88%,
      #333 88%,
      #333 100%);
}

#road:before,
#road:after{
  content:"";
  position:absolute;
  top:-200%;
  width:7px;
  height:400%;
  background:white;
  opacity:.9;
}

#road:before{left:12%}
#road:after{right:12%}

.lane{
  position:absolute;
  top:-150px;
  width:7px;
  height:100px;
  background:white;
  left:50%;
  transform:translateX(-50%);
  animation:roadMove linear infinite;
}

.lane:nth-child(2){animation-duration:.65s}
.lane:nth-child(3){animation-duration:.65s;animation-delay:.2s}
.lane:nth-child(4){animation-duration:.65s;animation-delay:.4s}

@keyframes roadMove{
  from{transform:translate(-50%,-100px)}
  to{transform:translate(-50%,800px)}
}

/* CAR */
.car{
  position:absolute;
  width:68px;
  height:120px;
  border-radius:20px 20px 15px 15px;
  z-index:10;
  box-shadow:
    0 12px 20px rgba(0,0,0,.7),
    inset 8px 0 10px rgba(255,255,255,.2),
    inset -8px 0 10px rgba(0,0,0,.25);
}

.car:before{
  content:"";
  position:absolute;
  width:50px;
  height:38px;
  left:9px;
  top:12px;
  border-radius:12px;
  background:linear-gradient(#bde7ff,#4d7287);
  border:3px solid #111;
}

.car:after{
  content:"";
  position:absolute;
  width:48px;
  height:12px;
  left:10px;
  bottom:13px;
  border-radius:8px;
  background:#171717;
}

.player{
  left:50%;
  bottom:20px;
  transform:translateX(-50%);
  background:linear-gradient(
    90deg,
    #700,
    #ff1515 45%,
    #900
  );
}

.player .wheel{
  position:absolute;
  width:10px;
  height:27px;
  background:#111;
  border-radius:6px;
  top:45px;
}

.player .w1{left:-8px}
.player .w2{right:-8px}
.player .w3{left:-8px;top:82px}
.player .w4{right:-8px;top:82px}

.enemy{
  top:-150px;
  background:linear-gradient(
    90deg,
    #777,
    #eee 45%,
    #888
  );
}

/* HUD */
#hud{
  position:absolute;
  left:10px;
  right:10px;
  top:10px;
  z-index:30;
  display:flex;
  justify-content:space-between;
  font-weight:bold;
  font-size:15px;
}

#gear{
  background:#111;
  border:2px solid #fff;
  padding:5px 10px;
  border-radius:10px;
}

#mistakes{
  background:#111;
  padding:5px 10px;
  border-radius:10px;
}

/* CONTROLS */
#controls{
  width:min(96vw,500px);
  margin:10px auto;
  display:flex;
  justify-content:space-around;
  align-items:center;
  gap:8px;
}

button{
  border:0;
  color:white;
  font-weight:bold;
  border-radius:18px;
  background:#168fea;
  box-shadow:0 5px 0 #075b9c;
  touch-action:none;
}

button:active{
  transform:translateY(4px);
  box-shadow:0 1px 0 #075b9c;
}

.ctrl{
  width:105px;
  height:65px;
  font-size:24px;
}

/* STEERING WHEEL */
#wheel{
  width:82px;
  height:82px;
  border:9px solid #ddd;
  border-radius:50%;
  position:relative;
  background:#111;
  box-shadow:0 5px 15px #000;
  touch-action:none;
}

#wheel:before{
  content:"";
  position:absolute;
  width:9px;
  height:66px;
  background:#ddd;
  left:50%;
  top:0;
  transform:translateX(-50%);
}

#wheel:after{
  content:"";
  position:absolute;
  width:66px;
  height:9px;
  background:#ddd;
  left:0;
  top:50%;
  transform:translateY(-50%);
}

/* EXTRA BUTTONS */
#extras{
  display:flex;
  justify-content:center;
  gap:8px;
  margin-top:8px;
}

.small{
  padding:10px 14px;
  font-size:14px;
  background:#333;
  box-shadow:none;
}

/* GAME OVER */
#gameOver{
  display:none;
  position:absolute;
  inset:0;
  z-index:100;
  background:rgba(0,0,0,.88);
  align-items:center;
  justify-content:center;
  flex-direction:column;
}

#gameOver h2{
  font-size:38px;
  margin:5px;
  color:#ff3333;
}

#gameOver p{
  font-size:20px;
}

#restart{
  padding:15px 30px;
  font-size:20px;
  background:#19a8ff;
}

/* MOBILE */
@media(max-height:700px){
  #game{
    height:65vh;
    min-height:430px;
  }

  h1{
    font-size:25px;
  }

  .ctrl{
    height:55px;
  }
}
</style>
</head>

<body>

<h1>🚗 Real Car Rush</h1>

<div id="info">
Score: <span id="score">0</span>
|
High Score: <span id="high">0</span>
</div>

<div id="game">

  <div id="road">
    <div class="lane"></div>
    <div class="lane"></div>
    <div class="lane"></div>
  </div>

  <div id="hud">
    <div id="gear">GEAR: N</div>
    <div id="mistakes">❤️❤️❤️</div>
  </div>

  <div class="car enemy" id="enemy1" style="left:15%"></div>
  <div class="car enemy" id="enemy2" style="left:62%;top:-450px"></div>
  <div class="car enemy" id="enemy3" style="left:38%;top:-800px"></div>

  <div class="car player" id="player">
    <span class="wheel w1"></span>
    <span class="wheel w2"></span>
    <span class="wheel w3"></span>
    <span class="wheel w4"></span>
  </div>

  <div id="gameOver">
    <h2>GAME OVER</h2>
    <p>3 Mistakes!</p>
    <p>Score: <span id="finalScore">0</span></p>
    <button id="restart">🔄 RESTART</button>
  </div>

</div>

<div id="controls">

  <button class="ctrl" id="left">⬅️ LEFT</button>

  <div id="wheel"></div>

  <button class="ctrl" id="right">RIGHT ➡️</button>

</div>

<div id="extras">
  <button class="small" id="gearDown">− GEAR</button>
  <button class="small" id="gearUp">GEAR +</button>
  <button class="small" id="camera">🎥 CAMERA</button>
  <button class="small" id="tilt">📱 TILT</button>
</div>

<script>

/* =========================
   GAME VARIABLES
========================= */

const game =
document.getElementById("game");

const player =
document.getElementById("player");

const scoreEl =
document.getElementById("score");

const highEl =
document.getElementById("high");

const gearEl =
document.getElementById("gear");

const mistakesEl =
document.getElementById("mistakes");

const gameOver =
document.getElementById("gameOver");

const finalScore =
document.getElementById("finalScore");

const wheel =
document.getElementById("wheel");

const enemies=[
 document.getElementById("enemy1"),
 document.getElementById("enemy2"),
 document.getElementById("enemy3")
];

let x=50;
let score=0;
let mistakes=0;
let gear=0;
let cameraMode=0;
let tiltMode=false;
let running=true;

let highScore=
Number(localStorage.getItem("realCarHigh")||0);

highEl.textContent=highScore;

/* GEAR SPEED */
const gearSpeed=[
  2.0,
  3.0,
  4.2,
  5.5,
  6.8,
  8.2,
  10
];

/* =========================
   PLAYER MOVEMENT
========================= */

function moveLeft(){
  if(!running)return;

  x-=4;

  if(x<15)x=15;

  updatePlayer();
}

function moveRight(){
  if(!running)return;

  x+=4;

  if(x>85)x=85;

  updatePlayer();
}

function updatePlayer(){

  player.style.left=x+"%";

  player.style.transform=
    "translateX(-50%) rotate("+
    ((x-50)*.5)+"deg)";
}

/* BUTTON HOLD */

let leftHold=false;
let rightHold=false;

document.getElementById("left")
.addEventListener("pointerdown",()=>{
  leftHold=true;
});

document.getElementById("right")
.addEventListener("pointerdown",()=>{
  rightHold=true;
});

document.addEventListener("pointerup",()=>{
  leftHold=false;
  rightHold=false;
});

/* KEYBOARD TOO */

document.addEventListener("keydown",e=>{
  if(e.key==="ArrowLeft")leftHold=true;
  if(e.key==="ArrowRight")rightHold=true;
});

document.addEventListener("keyup",e=>{
  if(e.key==="ArrowLeft")leftHold=false;
  if(e.key==="ArrowRight")rightHold=false;
});

/* =========================
   STEERING WHEEL
========================= */

let wheelActive=false;

wheel.addEventListener("pointerdown",e=>{
  wheelActive=true;
  wheel.setPointerCapture(e.pointerId);
});

wheel.addEventListener("pointermove",e=>{
  if(!wheelActive || !running)return;

  const rect=wheel.getBoundingClientRect();

  const center=
    rect.left+rect.width/2;

  const diff=e.clientX-center;

  wheel.style.transform=
    "rotate("+diff+"deg)";

  x+=diff*.025;

  if(x<15)x=15;
  if(x>85)x=85;

  updatePlayer();
});

wheel.addEventListener("pointerup",()=>{
  wheelActive=false;
  wheel.style.transform="rotate(0deg)";
});

/* =========================
   GEAR
========================= */

function updateGear(){

  const names=[
    "N",
    "1",
    "2",
    "3",
    "4",
    "5",
    "6"
  ];

  gearEl.textContent=
    "GEAR: "+names[gear];
}

document.getElementById("gearUp")
.onclick=()=>{
  if(gear<6){
    gear++;
    updateGear();
  }
};

document.getElementById("gearDown")
.onclick=()=>{
  if(gear>0){
    gear--;
    updateGear();
  }
};

updateGear();

/* =========================
   CAMERA ANGLES
========================= */

document.getElementById("camera")
.onclick=()=>{

  cameraMode++;

  if(cameraMode>6)
    cameraMode=0;

  const angles=[
    "translate(0,0)",
    "rotateX(8deg)",
    "rotateY(-8deg)",
    "rotateY(8deg)",
    "rotateX(-8deg)",
    "rotateX(5deg) rotateY(-5deg)",
    "rotateX(5deg) rotateY(5deg)"
  ];

  game.style.transform=
    angles[cameraMode];

};

/* =========================
   TILT CONTROL
========================= */

document.getElementById("tilt")
.onclick=async()=>{

  tiltMode=!tiltMode;

  if(tiltMode){

    try{

      if(
        typeof DeviceOrientationEvent !==
        "undefined" &&
        typeof DeviceOrientationEvent
        .requestPermission==="function"
      ){

        const permission=
          await DeviceOrientationEvent
          .requestPermission();

        if(permission!=="granted"){
          tiltMode=false;
          return;
        }
      }

      window.addEventListener(
        "deviceorientation",
        handleTilt
      );

    }catch(e){

      tiltMode=false;
      alert("Mobile tilt supported nahi hai.");

    }

  }else{

    window.removeEventListener(
      "deviceorientation",
      handleTilt
    );

  }
};

function handleTilt(e){

  if(!tiltMode || !running)return;

  let gamma=e.gamma||0;

  x+=gamma*.012;

  if(x<15)x=15;
  if(x>85)x=85;

  updatePlayer();
}

/* =========================
   ENEMY MOVEMENT
========================= */

function resetEnemy(enemy){

  const lane=
    15+
    Math.floor(Math.random()*70);

  enemy.style.left=
    lane+"%";

  enemy.style.top=
    (-150-
    Math.random()*500)+"px";
}

function collision(a,b){

  const r1=
    a.getBoundingClientRect();

  const r2=
    b.getBoundingClientRect();

  return !(
    r1.right<r2.left ||
    r1.left>r2.right ||
    r1.bottom<r2.top ||
    r1.top>r2.bottom
  );
}

/* =========================
   MISTAKES
========================= */

function addMistake(){

  mistakes++;

  let hearts="";

  for(let i=0;i<3;i++){

    hearts+=
      i<mistakes ? "🖤" : "❤️";

  }

  mistakesEl.textContent=hearts;

  if(mistakes>=3){
    endGame();
  }
}

/* =========================
   MAIN GAME LOOP
========================= */

function gameLoop(){

  if(!running)return;

  /* steering */

  if(leftHold)
    moveLeft();

  if(rightHold)
    moveRight();

  /* enemies */

  enemies.forEach(enemy=>{

    let top=
      parseFloat(enemy.style.top);

    if(isNaN(top))
      top=-150;

    top+=gearSpeed[gear];

    enemy.style.top=top+"px";

    /* collision */

    if(collision(player,enemy)){

      addMistake();

      resetEnemy(enemy);

    }

    /* passed car */

    if(top>game.clientHeight){

      score++;

      scoreEl.textContent=score;

      if(score>highScore){

        highScore=score;

        highEl.textContent=
          highScore;

        localStorage.setItem(
          "realCarHigh",
          highScore
        );
      }

      resetEnemy(enemy);
    }

  });

  requestAnimationFrame(gameLoop);
}

/* =========================
   GAME OVER
========================= */

function endGame(){

  running=false;

  finalScore.textContent=score;

  gameOver.style.display="flex";
}

/* =========================
   RESTART
========================= */

document.getElementById("restart")
.onclick=()=>{

  score=0;
  mistakes=0;
  gear=0;
  x=50;
  running=true;

  scoreEl.textContent="0";

  mistakesEl.textContent=
    "❤️❤️❤️";

  updateGear();
  updatePlayer();

  enemies.forEach(resetEnemy);

  gameOver.style.display="none";

  requestAnimationFrame(gameLoop);
};

/* =========================
   START
========================= */

enemies.forEach(resetEnemy);

updatePlayer();

requestAnimationFrame(gameLoop);

</script>

</body>
</html>
