<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Real Car Rush</title>

<style>
*{
  box-sizing:border-box;
  user-select:none;
  -webkit-user-select:none;
}

body{
  margin:0;
  background:#111;
  color:white;
  font-family:Arial,sans-serif;
  text-align:center;
  overflow:hidden;
}

h1{
  margin:8px 0 3px;
  font-size:22px;
}

#score{
  font-size:18px;
  margin-bottom:6px;
}

#game{
  position:relative;
  width:360px;
  max-width:94vw;
  height:600px;
  margin:auto;
  background:#333;
  overflow:hidden;
  border:5px solid white;
  border-radius:16px;
}

/* Road lines */
.road-line{
  position:absolute;
  width:8px;
  height:80px;
  background:white;
  left:50%;
  transform:translateX(-50%);
  animation:road 0.75s linear infinite;
}

@keyframes road{
  from{top:-100px}
  to{top:600px}
}

/* Car */
.car{
  position:absolute;
  width:58px;
  height:100px;
  border-radius:15px 15px 10px 10px;
  left:151px;
  bottom:20px;
  z-index:5;
  background:linear-gradient(
    90deg,
    #8b0000 0%,
    #ff1a1a 35%,
    #d40000 70%,
    #760000 100%
  );
  box-shadow:
    inset 5px 0 8px rgba(255,255,255,.25),
    inset -5px 0 8px rgba(0,0,0,.35),
    0 5px 12px rgba(0,0,0,.7);
}

/* Windows */
.car:before{
  content:"";
  position:absolute;
  left:9px;
  top:12px;
  width:40px;
  height:31px;
  border-radius:9px 9px 5px 5px;
  background:linear-gradient(135deg,#bfe8ff,#193b50);
  border:2px solid #222;
}

/* Front bumper */
.car:after{
  content:"";
  position:absolute;
  left:7px;
  bottom:8px;
  width:44px;
  height:12px;
  border-radius:5px;
  background:#222;
}

/* Wheels */
.wheel{
  position:absolute;
  width:10px;
  height:25px;
  background:#111;
  border-radius:5px;
  top:28px;
  z-index:-1;
}

.w1{left:-7px}
.w2{right:-7px}

.w3{
  left:-7px;
  top:65px;
}

.w4{
  right:-7px;
  top:65px;
}

/* Enemy cars */
.enemy{
  position:absolute;
  width:58px;
  height:100px;
  border-radius:15px 15px 10px 10px;
  top:-110px;
  z-index:4;
  background:linear-gradient(
    90deg,
    #444,
    #ddd,
    #777
  );
  box-shadow:0 5px 12px rgba(0,0,0,.7);
}

.enemy:before{
  content:"";
  position:absolute;
  left:9px;
  top:12px;
  width:40px;
  height:31px;
  border-radius:9px 9px 5px 5px;
  background:#182b35;
  border:2px solid #111;
}

.enemy:after{
  content:"";
  position:absolute;
  left:7px;
  bottom:8px;
  width:44px;
  height:12px;
  border-radius:5px;
  background:#222;
}

/* Buttons */
.controls{
  display:flex;
  justify-content:center;
  gap:18px;
  margin-top:12px;
}

button{
  width:140px;
  padding:17px 10px;
  font-size:22px;
  font-weight:bold;
  border:0;
  border-radius:14px;
  background:#2196f3;
  color:white;
  touch-action:manipulation;
  -webkit-tap-highlight-color:transparent;
}

button:active{
  transform:scale(.94);
  background:#1976d2;
}

/* Game over */
#gameOver{
  display:none;
  position:absolute;
  inset:0;
  background:rgba(0,0,0,.82);
  z-index:20;
  align-items:center;
  justify-content:center;
  flex-direction:column;
}

#gameOver h2{
  font-size:34px;
  margin:10px;
}

#gameOver p{
  font-size:20px;
}

#restart{
  width:180px;
  background:#e53935;
}
</style>
</head>

<body>

<h1>🚗 Real Car Rush</h1>
<div id="score">Score: 0 | High Score: 0</div>

<div id="game">

  <div class="road-line"></div>

  <div id="player" class="car">
    <span class="wheel w1"></span>
    <span class="wheel w2"></span>
    <span class="wheel w3"></span>
    <span class="wheel w4"></span>
  </div>

  <div id="gameOver">
    <h2>💥 GAME OVER</h2>
    <p id="finalScore">Score: 0</p>
    <button id="restart">🔄 Restart</button>
  </div>

</div>

<div class="controls">
  <button id="left">⬅️ Left</button>
  <button id="right">Right ➡️</button>
</div>

<script>

const game = document.getElementById("game");
const player = document.getElementById("player");

const leftBtn = document.getElementById("left");
const rightBtn = document.getElementById("right");

const scoreText = document.getElementById("score");
const gameOverBox = document.getElementById("gameOver");
const finalScore = document.getElementById("finalScore");
const restartBtn = document.getElementById("restart");

let playerX = 151;
let score = 0;
let speed = 5;
let running = true;
let enemyTimer;

/* High score */
let highScore = Number(localStorage.getItem("realCarHighScore") || 0);

function updateScore(){
  scoreText.textContent =
    "Score: " + score + " | High Score: " + highScore;
}

/* Move car */
function moveLeft(){
  if(!running) return;

  playerX -= 35;

  if(playerX < 5){
    playerX = 5;
  }

  player.style.left = playerX + "px";
}

function moveRight(){
  if(!running) return;

  playerX += 35;

  const maxX = game.clientWidth - player.offsetWidth - 5;

  if(playerX > maxX){
    playerX = maxX;
  }

  player.style.left = playerX + "px";
}

/* MOBILE TOUCH + CLICK */
leftBtn.addEventListener("touchstart", function(e){
  e.preventDefault();
  moveLeft();
}, {passive:false});

rightBtn.addEventListener("touchstart", function(e){
  e.preventDefault();
  moveRight();
}, {passive:false});

leftBtn.addEventListener("click", moveLeft);
rightBtn.addEventListener("click", moveRight);

/* Keyboard */
document.addEventListener("keydown",function(e){

  if(e.key === "ArrowLeft"){
    moveLeft();
  }

  if(e.key === "ArrowRight"){
    moveRight();
  }

});

/* Enemy */
function createEnemy(){

  if(!running) return;

  const enemy = document.createElement("div");
  enemy.className = "enemy";

  const lanes = [25,151,277];
  const lane = lanes[Math.floor(Math.random()*lanes.length)];

  enemy.style.left = lane + "px";
  enemy.style.top = "-110px";

  game.appendChild(enemy);

  let y = -110;

  const move = setInterval(function(){

    if(!running){
      clearInterval(move);
      enemy.remove();
      return;
    }

    y += speed;
    enemy.style.top = y + "px";

    /* Collision */
    const p = player.getBoundingClientRect();
    const e = enemy.getBoundingClientRect();

    if(
      p.left < e.right &&
      p.right > e.left &&
      p.top < e.bottom &&
      p.bottom > e.top
    ){
      clearInterval(move);
      enemy.remove();
      endGame();
      return;
    }

    /* Passed enemy */
    if(y > game.clientHeight){

      clearInterval(move);
      enemy.remove();

      score++;

      if(score > highScore){
        highScore = score;
        localStorage.setItem(
          "realCarHighScore",
          highScore
        );
      }

      updateScore();

      /* Speed increases */
      if(score % 5 === 0){
        speed += 0.7;
      }
    }

  },20);
}

/* Game over */
function endGame(){

  running = false;

  clearInterval(enemyTimer);

  finalScore.textContent =
    "Your Score: " + score;

  gameOverBox.style.display = "flex";
}

/* Restart */
function restart(){

  document.querySelectorAll(".enemy").forEach(function(e){
    e.remove();
  });

  playerX = 151;
  score = 0;
  speed = 5;
  running = true;

  player.style.left = playerX + "px";

  gameOverBox.style.display = "none";

  updateScore();

  startEnemies();
}

/* Start enemy system */
function startEnemies(){

  clearInterval(enemyTimer);

  enemyTimer = setInterval(function(){
    createEnemy();
  },1000);
}

restartBtn.addEventListener("click", restart);

/* Start */
updateScore();
startEnemies();

</script>

</body>
</html>
